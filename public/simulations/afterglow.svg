<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" fill="none">
<!-- Parallax layers: <img src="…svg#id"> shows only that layer; without a fragment, the whole picture. -->
<style>svg:has(.layer:target) .layer:not(:target){display:none}</style>
<defs>
 <radialGradient id="dusk" cx=".5" cy=".58" r=".7"><stop stop-color="#3a1e12"/><stop offset=".45" stop-color="#160f10"/><stop offset="1" stop-color="#050609"/></radialGradient>
 <radialGradient id="giant" cx=".5" cy=".5" r=".5"><stop stop-color="#ffb86a"/><stop offset=".55" stop-color="#e8702a"/><stop offset=".86" stop-color="#9e2f12"/><stop offset="1" stop-color="#5a1708"/></radialGradient>
 <radialGradient id="glare" cx=".5" cy=".5" r=".5"><stop stop-color="#ff9a4a" stop-opacity=".55"/><stop offset=".5" stop-color="#c84d1c" stop-opacity=".18"/><stop offset="1" stop-color="#c84d1c" stop-opacity="0"/></radialGradient>
 <linearGradient id="sea" x1="0" y1="560" x2="0" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#1b0e0b"/><stop offset="1" stop-color="#050609"/></linearGradient>
 <linearGradient id="path" x1="500" y1="560" x2="500" y2="760" gradientUnits="userSpaceOnUse"><stop stop-color="#ffb070" stop-opacity=".9"/><stop offset="1" stop-color="#e8702a" stop-opacity="0"/></linearGradient>
 <clipPath id="above"><rect width="1000" height="560"/></clipPath>
</defs>
<g class="layer" id="layer-sky">
 <rect width="1000" height="800" fill="url(#dusk)"/>
 <g fill="#f4f1ea">
  <circle cx="120" cy="90" r="1.6"/><circle cx="220" cy="160" r="1.1"/><circle cx="330" cy="60" r="1.4" fill="#b9cce6"/><circle cx="60" cy="260" r="1"/><circle cx="880" cy="70" r="1.5"/><circle cx="930" cy="200" r="1.1" fill="#ffd6a0"/><circle cx="780" cy="40" r="1"/><circle cx="170" cy="340" r="1.2"/><circle cx="960" cy="330" r="1.3"/><circle cx="420" cy="30" r="1"/><circle cx="700" cy="120" r="1.2" fill="#b9cce6"/><circle cx="40" cy="430" r="1"/>
 </g>
</g>
<g class="layer" id="layer-sun">
 <circle cx="500" cy="420" r="420" fill="url(#glare)"/>
 <circle cx="500" cy="420" r="230" fill="url(#giant)" clip-path="url(#above)"/>
</g>
<g class="layer" id="layer-sea">
 <rect y="560" width="1000" height="240" fill="url(#sea)"/>
 <path d="M500 560v200" stroke="url(#path)" stroke-width="140" stroke-linecap="round" opacity=".55"/>
 <path d="M0 560h1000" stroke="#e2c07a" stroke-opacity=".85"/>
 <path d="M300 560h400" stroke="#ffd79a"/>
 <path d="M440 600h120M470 640h60M455 680h90" stroke="#ffb070" stroke-opacity=".5" stroke-width="2"/>
</g>
</svg>
